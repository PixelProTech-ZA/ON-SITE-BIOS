<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ON-SITE BIOS — PixelProTech Solutions</title>
<meta name="description" content="Field diagnostic and decision system for on-site computer technicians.">
<meta name="theme-color" content="#14181c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
/* ============================================================
   ON-SITE BIOS — token system
   Base: dark slate field-instrument housing, not pure black.
   Accent: amber indicator lamp. Data set in monospace, like
   a meter readout. Body copy in a plain humanist sans.
   ============================================================ */
:root{
  --bg:#14181c;
  --bg-raise:#191e23;
  --panel:#1d2228;
  --panel-alt:#232a31;
  --border:#2c333b;
  --border-strong:#3a434c;
  --text:#e7e4dc;
  --text-dim:#9aa3ac;
  --text-faint:#69727b;
  --accent:#e8a33d;
  --accent-ink:#20160a;
  --accent-dim:#5a4423;
  --danger:#c4573f;
  --danger-dim:#4a2b23;
  --success:#5b8a72;
  --success-dim:#233a2e;
  --unknown:#576270;
  --unknown-dim:#252c34;
  --mono:ui-monospace,"SFMono-Regular","Cascadia Mono","Roboto Mono",Consolas,"Liberation Mono",monospace;
  --sans:ui-sans-serif,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --radius:3px;
  --gap:16px;
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{
  content:"";
  position:fixed;inset:0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px);
  background-size:100% 44px;
  opacity:.05;
  pointer-events:none;
  z-index:0;
}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-0.01em;}
p{margin:0 0 10px;}
button{font-family:inherit;}
a{color:var(--accent);}
::selection{background:var(--accent-dim);color:var(--text);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.mono{font-family:var(--mono);}
.dim{color:var(--text-dim);}
.faint{color:var(--text-faint);}

#app{
  position:relative;z-index:1;
  min-height:100%;
  display:flex;
  flex-direction:column;
  max-width:760px;
  margin:0 auto;
}

/* ---------- header ---------- */
header.topbar{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,var(--bg-raise),var(--bg));
  border-bottom:1px solid var(--border);
  padding:10px 14px;
}
.brand-row{
  display:flex;align-items:baseline;justify-content:space-between;gap:10px;
}
.brand{
  font-family:var(--mono);
  font-size:10px;
  letter-spacing:.14em;
  color:var(--text-faint);
}
.brand strong{color:var(--accent);font-weight:600;}
.job-chip{
  font-family:var(--mono);
  font-size:11px;
  color:var(--text-dim);
  border:1px solid var(--border-strong);
  border-radius:var(--radius);
  padding:3px 7px;
  white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:200px;
}
.title-row{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:6px;
}
.title-row h1{font-size:19px;}
.stage-track{
  display:flex;gap:3px;margin-top:8px;overflow-x:auto;
  padding-bottom:2px;
  scrollbar-width:none;
}
.stage-track::-webkit-scrollbar{display:none;}
.stage-dot{
  flex:0 0 auto;
  width:16px;height:5px;border-radius:2px;
  background:var(--unknown-dim);
  border:1px solid var(--border);
}
.stage-dot.active{background:var(--accent);border-color:var(--accent);}
.stage-dot.done{background:var(--success);border-color:var(--success);}

/* ---------- nav ---------- */
nav.tabs{
  position:sticky;bottom:0;z-index:10;
  display:flex;overflow-x:auto;
  background:var(--bg-raise);
  border-top:1px solid var(--border);
  scrollbar-width:none;
}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs button{
  flex:0 0 auto;
  background:none;border:none;color:var(--text-faint);
  padding:10px 13px;font-size:11px;font-family:var(--mono);
  letter-spacing:.04em;
  border-top:2px solid transparent;
  cursor:pointer;white-space:nowrap;
}
nav.tabs button.active{color:var(--accent);border-top-color:var(--accent);}
nav.tabs button:hover{color:var(--text);}

/* ---------- main ---------- */
main{
  flex:1;padding:16px 14px 28px;
}
.view{animation:fadein .15s ease-out;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:14px;
  margin-bottom:12px;
}
.card + .card{margin-top:0;}
.card-title{
  font-family:var(--mono);
  font-size:11px;
  letter-spacing:.08em;
  color:var(--text-dim);
  margin-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;
}
.callout{
  border:1px solid var(--border-strong);
  border-left:3px solid var(--accent);
  background:var(--panel-alt);
  border-radius:var(--radius);
  padding:12px 14px;
  margin-bottom:12px;
}
.callout.danger{border-left-color:var(--danger);}
.callout.success{border-left-color:var(--success);}
.callout h4{font-size:13px;margin-bottom:4px;}
.callout p:last-child{margin-bottom:0;}

.field{margin-bottom:12px;}
.field label{
  display:block;font-size:12px;color:var(--text-dim);
  margin-bottom:5px;
}
.field .hint{font-size:11px;color:var(--text-faint);margin-top:4px;}
input[type=text],input[type=number],input[type=date],input[type=time],textarea,select{
  width:100%;
  background:var(--bg-raise);
  border:1px solid var(--border-strong);
  color:var(--text);
  padding:9px 10px;
  border-radius:var(--radius);
  font-family:var(--mono);
  font-size:13.5px;
}
textarea{min-height:64px;resize:vertical;font-family:var(--sans);font-size:14px;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);background-position:calc(100% - 16px) center,calc(100% - 11px) center;background-size:5px 5px,5px 5px;background-repeat:no-repeat;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
@media (max-width:480px){.row2{grid-template-columns:1fr;}}

.chk-row{display:flex;align-items:flex-start;gap:9px;margin-bottom:10px;cursor:pointer;}
.chk-row input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:0 0 auto;}
.chk-row span{font-size:13.5px;}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--panel-alt);
  border:1px solid var(--border-strong);
  color:var(--text);
  padding:10px 16px;
  border-radius:var(--radius);
  font-size:13.5px;font-weight:500;
  cursor:pointer;
}
.btn:hover{border-color:var(--text-dim);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-danger{border-color:var(--danger);color:var(--danger);background:transparent;}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-dim);}
.btn-block{width:100%;}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.led{
  display:inline-block;width:8px;height:8px;border-radius:50%;
  background:var(--unknown);flex:0 0 auto;
}
.led.pass{background:var(--success);box-shadow:0 0 6px var(--success);}
.led.fail{background:var(--danger);box-shadow:0 0 6px var(--danger);}
.led.unknown{background:var(--unknown);}
.led.testing{background:var(--accent);box-shadow:0 0 6px var(--accent);}

.status-pill{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  padding:2px 7px;border-radius:20px;border:1px solid var(--border-strong);
  color:var(--text-dim);display:inline-flex;align-items:center;gap:5px;
}

details.acc{
  border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:8px;background:var(--panel);overflow:hidden;
}
details.acc summary{
  padding:11px 13px;cursor:pointer;list-style:none;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  font-size:14px;font-weight:500;
}
details.acc summary::-webkit-details-marker{display:none;}
details.acc summary::after{
  content:"+";color:var(--text-faint);font-size:16px;font-family:var(--mono);
}
details.acc[open] summary::after{content:"–";}
details.acc .acc-body{padding:0 13px 13px;color:var(--text-dim);font-size:13.5px;}
details.acc .acc-body ul{margin:6px 0;padding-left:18px;}
details.acc .acc-body li{margin-bottom:4px;}

.stage-item{
  border:1px solid var(--border);border-radius:var(--radius);
  margin-bottom:8px;background:var(--panel);
}
.stage-head{
  display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer;
}
.stage-head .idx{font-family:var(--mono);font-size:11px;color:var(--text-faint);width:18px;}
.stage-head .name{flex:1;font-size:14px;font-weight:500;}
.stage-body{padding:0 13px 13px;display:none;}
.stage-item.open .stage-body{display:block;}
.qlist{margin:8px 0 12px;padding-left:0;list-style:none;}
.qlist li{
  font-size:13px;color:var(--text-dim);padding:5px 0 5px 16px;
  border-left:2px solid var(--border-strong);margin-bottom:4px;
}

.empty{
  text-align:center;padding:34px 16px;color:var(--text-faint);
}
.empty .glyph{font-family:var(--mono);font-size:26px;color:var(--text-faint);margin-bottom:8px;}

.joblist-item{
  display:flex;align-items:center;gap:10px;
  border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 13px;margin-bottom:8px;background:var(--panel);
  cursor:pointer;
}
.joblist-item:hover{border-color:var(--border-strong);}
.joblist-item .meta{flex:1;min-width:0;}
.joblist-item .meta .l1{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.joblist-item .meta .l2{font-size:12px;color:var(--text-faint);font-family:var(--mono);}

.badge-open{color:var(--accent);border-color:var(--accent-dim);}
.badge-closed{color:var(--success);border-color:var(--success-dim);}

.actionlog-item{border:1px solid var(--border);border-radius:var(--radius);padding:11px 13px;margin-bottom:8px;background:var(--panel);}
.actionlog-item h4{font-size:13.5px;margin-bottom:6px;}
.actionlog-item .kv{font-size:12.5px;color:var(--text-dim);margin-bottom:3px;}
.actionlog-item .kv b{color:var(--text);font-weight:500;}

.hero{
  text-align:center;padding:40px 10px 20px;
}
.hero .mark{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--text-faint);margin-bottom:14px;}
.hero h1{font-size:28px;line-height:1.15;margin-bottom:10px;}
.hero .tag{color:var(--text-dim);font-size:15px;margin-bottom:26px;}
.hero .tag em{color:var(--accent);font-style:normal;}

.review-check{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);}
.review-check:last-child{border-bottom:none;}
.review-check .led{margin-top:5px;}
.review-check .rc-text{flex:1;}
.review-check .rc-title{font-size:14px;}
.review-check .rc-note{font-size:12px;color:var(--text-faint);margin-top:2px;}

.verdict{
  text-align:center;padding:22px 14px;border-radius:var(--radius);
  border:1px solid var(--border-strong);margin-bottom:14px;
}
.verdict.met{border-color:var(--success);background:var(--success-dim);}
.verdict.notmet{border-color:var(--danger);background:var(--danger-dim);}
.verdict .vt{font-family:var(--mono);font-size:12px;letter-spacing:.1em;color:var(--text-dim);margin-bottom:6px;}
.verdict .vv{font-size:20px;font-weight:700;}
.verdict.met .vv{color:var(--success);}
.verdict.notmet .vv{color:var(--danger);}

.toast{
  position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
  background:var(--panel-alt);border:1px solid var(--border-strong);
  color:var(--text);padding:9px 16px;border-radius:var(--radius);
  font-size:13px;z-index:100;opacity:0;pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  max-width:88%;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

.tag-uentered{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--accent);
  border:1px solid var(--accent-dim);border-radius:2px;padding:1px 5px;
}
.divider{height:1px;background:var(--border);margin:14px 0;}
.grid-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
@media (max-width:420px){.grid-actions{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ==============================================================
   ON-SITE BIOS — PIXEL OG FIELD OPERATING SYSTEM
   Offline-first field diagnostic & decision system.
   Pure HTML / CSS / JavaScript. No frameworks. No fabricated
   capability: nothing here claims to read hardware, control
   firmware, run network calls, or process payment. Every field
   is either technician-entered or computed from technician-
   entered data, and is labelled accordingly.
   ============================================================== */
(function(){
"use strict";

var LS_KEY = "onsitebios_v1";

/* ---------------- persistence ---------------- */
function loadStore(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if(!raw) return {jobs:{}, order:[]};
    var parsed = JSON.parse(raw);
    if(!parsed.jobs) parsed.jobs = {};
    if(!parsed.order) parsed.order = [];
    return parsed;
  }catch(e){
    console.error("Storage read failed", e);
    return {jobs:{}, order:[]};
  }
}
function saveStore(store){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(store));
    return true;
  }catch(e){
    console.error("Storage write failed", e);
    toast("Could not save — device storage may be full.");
    return false;
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function nowISO(){ return new Date().toISOString(); }
function fmtDate(iso){
  if(!iso) return "—";
  var d = new Date(iso);
  if(isNaN(d)) return "—";
  return d.toLocaleString(undefined,{year:"numeric",month:"short",day:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function esc(s){
  if(s===undefined||s===null) return "";
  return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});
}

/* ---------------- app state ---------------- */
var store = loadStore();
var state = {
  view: "home",
  jobId: null,
  openStage: null   // which diagnostic-tree stage is expanded
};

function currentJob(){
  return state.jobId ? store.jobs[state.jobId] : null;
}

/* ---------------- job model ---------------- */
function blankJob(){
  return {
    id: uid(),
    createdAt: nowISO(),
    updatedAt: nowISO(),
    status: "open",
    intake: {
      machineType:"", manufacturer:"", model:"", serial:"", age:"",
      os:"", symptom:"", customerComplaint:"", powerCondition:"",
      visibleDamage:"", accessories:"", timeArrived:"", technicianName:""
    },
    baseline: {
      capturedAt:null, whatWorked:"", whatFailed:"", currentSettings:"",
      detectedHardwareNotes:"", errorMessages:"", bootConfig:"",
      visibleConditionNotes:"", evidenceNotes:""
    },
    firmware: {
      type:"unknown", version:"", date:"", bootMode:"", secureBoot:"",
      csm:"", tpm:"", bootOrder:"", bootManagerEntries:"", usbBoot:"",
      pxeBoot:"", storageDetection:"", firmwarePasswords:"",
      virtualization:"", hardwareConfig:"", recoveryOptions:""
    },
    diagnostic: {
      power:{status:"unknown",notes:""},
      post:{status:"unknown",notes:""},
      display:{status:"unknown",notes:""},
      input:{status:"unknown",notes:""},
      firmwareStage:{status:"unknown",notes:""},
      hardwareDetection:{status:"unknown",notes:""},
      bootTarget:{status:"unknown",notes:""},
      bootloader:{status:"unknown",notes:""},
      operatingSystem:{status:"unknown",notes:""},
      driversServices:{status:"unknown",notes:""},
      applicationUser:{status:"unknown",notes:""}
    },
    actions: [],
    certifiedAck:false,
    close: {
      workCompleted:"", result:"", remainingIssues:"", customerAck:false,
      amountDue:"", paymentStatus:"unpaid", paymentReference:"",
      leaveSafely:{
        reassembled:false, cables:false, tools:false, customerProperty:false,
        dataProtected:false, settingsRecorded:false, customerInformed:false,
        workAreaClean:false, machineTested:false, risksCommunicated:false
      },
      closedAt:null
    }
  };
}

function touch(job){ job.updatedAt = nowISO(); saveStore(store); }

/* ---------------- diagnostic tree definition ---------------- */
var STAGES = [
  {key:"power", label:"Power", q:[
    "Does the machine receive power at all — lights, fans, any response?",
    "Is the power source itself confirmed good (outlet, cable, battery, adapter)?",
    "What can you test safely to isolate power from everything downstream?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"post", label:"POST", q:[
    "Does the machine complete Power-On Self-Test — beeps, POST codes, splash screen?",
    "Are there beep codes, LED codes, or on-screen POST errors?",
    "What can you test safely to confirm POST is or isn't completing?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"display", label:"Display", q:[
    "Is there any video output at all, on any port, to any known-good display?",
    "Is the fault the display path, the GPU, or something upstream?",
    "What can you test safely (different cable, port, monitor)?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"input", label:"Input", q:[
    "Do keyboard and pointing devices respond at the firmware level?",
    "Is input available early enough to reach firmware setup at all?",
    "What can you test safely (wired keyboard, different port, USB vs PS/2)?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"firmwareStage", label:"Firmware", q:[
    "What do you know about the firmware — legacy BIOS or UEFI?",
    "What is currently configured, and what is the manufacturer default?",
    "What can you test safely without saving unconfirmed changes?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"hardwareDetection", label:"Hardware detection", q:[
    "What hardware does firmware detect, and what is missing?",
    "Is the missing item a physical fault, a connection fault, or a configuration fault?",
    "What can you test safely to isolate detection from data or OS state?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"bootTarget", label:"Boot target", q:[
    "What is the machine actually configured to boot from?",
    "Is the intended boot device present in the boot order at all?",
    "What can you test safely (boot menu, one-time boot override)?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"bootloader", label:"Bootloader", q:[
    "Does a bootloader load at all, on any device?",
    "Is this a missing, damaged, or misconfigured bootloader?",
    "What can you test safely without writing to disk?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"operatingSystem", label:"Operating system", q:[
    "Which layer is failing — kernel load, initialization, or user session?",
    "Is this one operating environment, or a multi-boot / unknown configuration?",
    "What can you test safely (safe mode, recovery environment, alternate media)?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"driversServices", label:"Drivers / services", q:[
    "Is the fault isolated to a specific driver, service, or subsystem?",
    "Did this coincide with any known change — update, install, removal?",
    "What can you test safely (device manager, service status, rollback)?",
    "What would that test prove?",
    "What could this test break?"
  ]},
  {key:"applicationUser", label:"Application / user level", q:[
    "Is the fault specific to one application, one user profile, or system-wide?",
    "Can it be reproduced under a clean profile or clean install of the app?",
    "What can you test safely without touching the customer's data?",
    "What would that test prove?",
    "What could this test break?"
  ]}
];
var STATUS_OPTS = [
  {v:"unknown", label:"Unknown"},
  {v:"testing", label:"Testing"},
  {v:"pass", label:"Pass — ruled out"},
  {v:"fail", label:"Fail — implicated"}
];

/* ---------------- challenge mode content ---------------- */
var CHALLENGES = [
  {t:"\u201CI cannot enter BIOS / UEFI setup.\u201D", body:[
    "Do not assume the firmware is locked or dead. Work through causes in order:",
    "LIST:Wrong key for this manufacturer/model",
    "LIST:Wrong timing — key window missed",
    "LIST:Fast boot enabled from a previous session, skipping the prompt",
    "LIST:Keyboard not initialised early enough (some USB or wireless keyboards)",
    "LIST:Wireless keyboard with no early-boot receiver support",
    "LIST:Manufacturer-specific entry procedure (button combo, cold boot only, app-based restart)",
    "LIST:A firmware password is set",
    "LIST:A genuine hardware fault is preventing POST entirely",
    "Isolate with a wired keyboard and the manufacturer's documented key before concluding anything about the firmware itself."
  ]},
  {t:"\u201CI cannot see the SSD.\u201D", body:[
    "Do not say the SSD is dead. Branch through the evidence:",
    "LIST:Is the drive physically present and seated (or, for M.2, correctly keyed and screwed down)?",
    "LIST:Is it detected in firmware at all, on any controller mode?",
    "LIST:Is the controller/slot itself visible and enabled in firmware?",
    "LIST:Is another drive detected on the same controller — isolating drive vs. controller?",
    "LIST:Was the machine recently opened, moved, or serviced?",
    "LIST:Was firmware configuration (AHCI/RAID/NVMe mode) recently changed?",
    "LIST:Is the boot entry simply missing while the drive itself is detected?",
    "The correct sentence at this stage is: \u201Cfirmware does not detect the storage device — what evidence supports the next test?\u201D, not a conclusion about the drive's health."
  ]},
  {t:"\u201CWindows / Linux / macOS won't boot.\u201D", body:[
    "Do not reinstall first. Identify the failing layer before acting:",
    "LIST:Does POST complete? If not, this isn't an OS problem yet.",

function go(view, jobId){

/* ---------------- toast ---------------- */
var toastTimer=null;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2200);
}

/* ---------------- render root ---------------- */
function render(){
  var app = document.getElementById("app");
  var job = currentJob();
  var html = "";
  html += renderHeader(job);
  html += '<main><div class="view">' + renderView(job) + '</div></main>';
  if(job) html += renderTabs();
  app.innerHTML = html;
  bindEvents();
}

function renderHeader(job){
  var h = '<header class="topbar"><div class="brand-row">';
  h += '<div class="brand">PIXEL<strong>PRO</strong>TECH SOLUTIONS &middot; FIELD UNIT</div>';
  if(job){
    h += '<div class="job-chip mono" data-action="go-home">'+esc(jobLabel(job))+'</div>';
  }
  h += '</div>';
  h += '<div class="title-row"><h1>ON-SITE BIOS</h1>';
  if(job){
    h += '<button class="btn btn-ghost" data-action="go-home" style="padding:4px 8px;font-size:12px;">Home</button>';
  }
  h += '</div>';
  if(job){
    h += '<div class="stage-track">';
    JOB_TABS.forEach(function(t){
      var cls = "stage-dot";
      if(t.v===state.view) cls += " active";
      else if(stageIsDone(job,t.v)) cls += " done";
      h += '<div class="'+cls+'" title="'+t.label+'"></div>';
    });
    h += '</div>';
  }
  h += '</header>';
  return h;
}

function jobLabel(job){
  var m = job.intake.manufacturer || "";
  var mo = job.intake.model || "";
  var name = (m+" "+mo).trim();
  if(!name) name = "UNIDENTIFIED MACHINE";
  return "JOB " + job.id.slice(-5).toUpperCase() + " \u2014 " + name;
}

function stageIsDone(job, view){
  switch(view){
    case "intake": return !!(job.intake.technicianName && job.intake.timeArrived);
    case "baseline": return !!job.baseline.capturedAt;
    case "firmware": return !!(job.firmware.version || job.firmware.bootMode || job.firmware.type!=="unknown");
    case "diagnose": return Object.keys(job.diagnostic).some(function(k){return job.diagnostic[k].status!=="unknown";});
    case "actions": return job.actions.length>0;
    case "challenges": return false;
    case "certified": return job.certifiedAck;
    case "close": return !!job.close.closedAt;
    case "review": return !!job.close.closedAt;
    default: return false;
  }
}

function renderTabs(){
  var h = '<nav class="tabs">';
  JOB_TABS.forEach(function(t){
    h += '<button class="'+(t.v===state.view?"active":"")+'" data-action="nav" data-view="'+t.v+'">'+t.label+'</button>';
  });
  h += '</nav>';
  return h;
}

function renderView(job){
  if(!job) return renderHome();
  switch(state.view){
    case "intake": return renderIntake(job);
    case "baseline": return renderBaseline(job);
    case "firmware": return renderFirmware(job);
    case "diagnose": return renderDiagnose(job);
    case "actions": return renderActions(job);
    case "challenges": return renderChallenges(job);
    case "certified": return renderCertified(job);
    case "close": return renderClose(job);
    case "review": return renderReview(job);
    default: return renderHome();
  }
}

    ["reassembled","Machine reassembled"],
    ["cables","Cables connected"],
    ["tools","Tools accounted for"],
    ["customerProperty","Customer property accounted for"],
    ["dataProtected","Data protected"],
    ["settingsRecorded","Settings recorded"],
    ["customerInformed","Customer informed"],
    ["workAreaClean","Work area clean"],
    ["machineTested","Machine tested"],
    ["risksCommunicated","Remaining risks communicated"]
  ];
  items.forEach(function(it){
    h += '<label class="chk-row"><input type="checkbox" '+(ls[it[0]]?"checked":"")+' data-field="close.leaveSafely.'+it[0]+'"><span>'+it[1]+'</span></label>';
  });
  h += '</div>';

  if(!closed){
    h += '<div class="btn-row"><button class="btn btn-primary btn-block" data-action="close-job">Close job</button></div>';
  } else {
    h += '<div class="btn-row"><button class="btn btn-block" data-action="reopen-job">Reopen job</button></div>';
  }

  h += navButtons("certified","review");
  return h;
}

/* ================= REVIEW ================= */
function computeReview(job){
  var checks = [];
  var intakeOk = !!(job.intake.technicianName && job.intake.timeArrived && job.intake.machineType);
  checks.push({key:"identity", title:"Established identity", pass: intakeOk,
    note: intakeOk?"":"Technician name, arrival time, and machine type are needed."});

  var baselineOk = !!job.baseline.capturedAt;
  checks.push({key:"baseline", title:"Captured a baseline", pass: baselineOk,
    note: baselineOk?"":"Baseline was never marked captured."});

  var diagTouched = Object.keys(job.diagnostic).some(function(k){return job.diagnostic[k].status!=="unknown";});
  var understoodOk = !!(job.intake.symptom && job.intake.customerComplaint) && diagTouched;
  checks.push({key:"understood", title:"Understood the problem", pass: understoodOk,
    note: understoodOk?"":"Symptom/complaint and at least one worked diagnostic-tree stage are needed."});

  var hasActions = job.actions.length>0;
  var testedOk = !hasActions || job.actions.every(function(a){return !!a.testPerformed;});
  checks.push({key:"tested", title:"Tested before changing", pass: testedOk,
    note: testedOk?"":"One or more logged actions has no test performed."});

  var documentedOk = !hasActions || job.actions.every(function(a){return !!(a.before && a.after);});
  checks.push({key:"documented", title:"Documented changes", pass: documentedOk,
    note: documentedOk?"":"One or more logged actions is missing a before/after state."});

  var verifiedOk = !hasActions || job.actions.every(function(a){return !!a.testResult;});
  checks.push({key:"verified", title:"Verified results", pass: verifiedOk,
    note: verifiedOk?"":"One or more logged actions has no recorded test result."});

  var ls = job.close.leaveSafely;
  var protectedOk = !!(ls.customerProperty && ls.dataProtected);
  checks.push({key:"protected", title:"Protected the customer's property", pass: protectedOk,
    note: protectedOk?"":"Customer property and data-protection checks are not both confirmed."});

  var honestOk = !!job.close.customerAck;
  checks.push({key:"honest", title:"Communicated honestly", pass: honestOk,
    note: honestOk?"":"Customer acknowledgement of honest communication is not confirmed."});

  var paidOk = !!(job.close.amountDue!=="" && job.close.paymentStatus);
  checks.push({key:"paid", title:"Recorded payment", pass: paidOk,
    note: paidOk?"":"Amount due and payment status are needed."});

  var allLeaveSafe = Object.keys(ls).every(function(k){return !!ls[k];});
  checks.push({key:"safe", title:"Left safely", pass: allLeaveSafe,
    note: allLeaveSafe?"":"Not every leave-safely item is confirmed."});

  var met = checks.every(function(c){return c.pass;});
  return {checks:checks, met:met};
}

function renderReview(job){
  var h = "";
  var rv = computeReview(job);
  h += '<div class="card"><div class="card-title">JOB REVIEW</div>';
  rv.checks.forEach(function(c){
    h += '<div class="review-check">';
    h += '<span class="led '+(c.pass?"pass":"fail")+'"></span>';
    h += '<div class="rc-text"><div class="rc-title">'+c.title+'</div>';
    if(!c.pass) h += '<div class="rc-note">'+c.note+'</div>';
    h += '</div></div>';
  });
  h += '</div>';

  h += '<div class="verdict '+(rv.met?"met":"notmet")+'">';
  h += '<div class="vt">PIXEL OG STANDARD</div>';
  h += '<div class="vv">'+(rv.met?"STANDARD MET":"STANDARD NOT MET")+'</div>';
  h += '</div>';
  if(!rv.met){
    h += '<p class="dim" style="font-size:13px;">This is not a score and nothing is wasted \u2014 it names exactly what is missing so it can be closed out. Go back to the relevant section above and finish it.</p>';
  } else {
    h += '<p class="dim" style="font-size:13px;">You can defend the work you did.</p>';
  }

  h += '<div class="card" style="margin-top:14px;"><div class="card-title">EXPORT THIS RECORD</div>';
  h += '<button class="btn btn-block" data-action="export-job">Download job record (JSON)</button>';
  h += '</div>';

  h += navButtons("close",null);
  return h;
}

/* ---------------- field renderers ---------------- */
function getPath(obj, path){
  return path.split(".").reduce(function(o,k){return (o||{})[k];}, obj);
}
function textField(job, path, label, val, ph){
  return '<div class="field"><label>'+esc(label)+'</label><input type="text" data-field="'+path+'" value="'+esc(val)+'" placeholder="'+esc(ph||"")+'"></div>';
}
function timeField(job, path, label, val){
  return '<div class="field"><label>'+esc(label)+'</label><input type="time" data-field="'+path+'" value="'+esc(val)+'"></div>';
}
function textareaField(job, path, label, val, ph){
  return '<div class="field"><label>'+esc(label)+'</label><textarea data-field="'+path+'" placeholder="'+esc(ph||"")+'">'+esc(val)+'</textarea></div>';
}
function selectField(job, path, label, opts, labelMap){
  var val = getPath(job, path);
  var h = '<div class="field"><label>'+esc(label)+'</label><select data-field="'+path+'">';
  opts.forEach(function(o){
    var lab = labelMap ? labelMap[o] : (o===""?"\u2014 Select \u2014":o);
    h += '<option value="'+esc(o)+'"'+(val===o?" selected":"")+'>'+esc(lab)+'</option>';
  });
  h += '</select></div>';
  return h;
}
function navButtons(prev, next){
  var h = '<div class="btn-row" style="margin-top:6px;">';
  if(prev) h += '<button class="btn" data-action="nav" data-view="'+prev+'">&larr; Back</button>';
  if(next) h += '<button class="btn btn-primary" data-action="nav" data-view="'+next+'" style="margin-left:auto;">Continue &rarr;</button>';
  h += '</div>';
  return h;
}

/* ---------------- events ---------------- */
function setPath(obj, path, value){
  var parts = path.split(".");
  var o = obj;
  for(var i=0;i<parts.length-1;i++){ o = o[parts[i]]; }
  o[parts[parts.length-1]] = value;
}

function bindEvents(){
  var app = document.getElementById("app");

  // field inputs (delegated)
  app.querySelectorAll("[data-field]").forEach(function(el){
    var evt = (el.tagName==="SELECT" || el.type==="checkbox") ? "change" : "input";
    el.addEventListener(evt, function(){
      var job = currentJob();
      if(!job) return;
      var path = el.getAttribute("data-field");
      var val = el.type==="checkbox" ? el.checked : el.value;
      setPath(job, path, val);
      touch(job);
      // live-update header progress dots / done state without full re-render on every keystroke
      if(evt==="change"){ render(); }
    });
  });

  app.querySelectorAll("[data-action]").forEach(function(el){
    el.addEventListener("click", function(ev){
      var action = el.getAttribute("data-action");
      handleAction(action, el, ev);
    });
  });

  var importInput = document.getElementById("import-file");
  if(importInput){
    importInput.addEventListener("change", function(e){
      var file = e.target.files[0];
      if(!file) return;
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var data = JSON.parse(reader.result);
          if(!data || !data.id) throw new Error("not a job record");
          data.id = uid(); // avoid collisions
          store.jobs[data.id] = data;
          store.order.push(data.id);
          saveStore(store);
          toast("Job record imported.");
          render();
        }catch(err){
          toast("That file isn't a valid job record.");
        }
      };
      reader.readAsText(file);
    });
  }
}

function handleAction(action, el){
  var job = currentJob();
  switch(action){
    case "go-home":
      go("home", null);
      break;
    case "start-job": {
      var j = blankJob();
      store.jobs[j.id] = j;
      store.order.push(j.id);
      saveStore(store);
      go("intake", j.id);
      toast("Job started. Face the machine.");
      break;
    }
    case "open-job":
      go("intake", el.getAttribute("data-id"));
      break;
    case "view-challenges-standalone":
      go("challenges", null);
      break;
    case "nav":
      go(el.getAttribute("data-view"));
      break;
    case "toggle-stage": {
      var k = el.getAttribute("data-key");
      state.openStage = (state.openStage===k) ? null : k;
      render();
      break;
    }
    case "capture-baseline":
      if(job){ job.baseline.capturedAt = nowISO(); touch(job); toast("Baseline captured."); render(); }
      break;
    case "add-action": {
      if(!job) break;
      var desc = document.getElementById("af-desc").value.trim();
      if(!desc){ toast("Describe the action before logging it."); break; }
      job.actions.push({
        id: uid(),
        timestamp: nowISO(),
        description: desc,
        before: document.getElementById("af-before").value.trim(),
        after: document.getElementById("af-after").value.trim(),
        testPerformed: document.getElementById("af-test").value.trim(),
        testResult: document.getElementById("af-result").value.trim(),
        risk: document.getElementById("af-risk").value.trim(),
        rollbackPlan: document.getElementById("af-rollback").value.trim()
      });
      touch(job);
      toast("Action logged.");
      render();
      break;
    }
    case "delete-action": {
      if(!job) break;
      var id = el.getAttribute("data-id");
      job.actions = job.actions.filter(function(a){return a.id!==id;});
      touch(job);
      render();
      break;
    }
    case "close-job":
      if(job){
        job.status = "closed";
        job.close.closedAt = nowISO();
        touch(job);
        toast("Job closed.");
        go("review");
      }
      break;
    case "reopen-job":
      if(job){
        job.status = "open";
        job.close.closedAt = null;
        touch(job);
        toast("Job reopened.");
        render();
      }
      break;
    case "export-job":
      if(job) exportJob(job);
      break;
  }
}

function exportJob(job){
  var blob = new Blob([JSON.stringify(job,null,2)], {type:"application/json"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "onsitebios-job-"+job.id+".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url);}, 4000);
}

/* ---------------- boot ---------------- */
render();

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(err){
      console.warn("Service worker registration failed (offline install won't be available):", err);
    });
  });
}

})();
